{% extends 'store/base.html' %}
{% block title %}Something went wrong — Northstar Store{% endblock %}
{% block content %}
<section class="error-page container">
    <span class="error-code">500</span>
    <h1>We dropped something.</h1>
    <p class="error-copy">Our team has been notified and is already fixing it. Please try again in a moment.</p>
    <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
        <a class="btn btn-accent rounded-pill px-4" href="{% url 'store:home' %}"><i class="bi bi-house me-2"></i>Back to home</a>
        <a class="btn btn-ghost-dark rounded-pill px-4" href="{% url 'store:product_list' %}">Browse the shop</a>
    </div>
</section>
{% endblock %}
